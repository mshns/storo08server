<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron&family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <title>storo08 server</title>
    <style>
      body {
        font-family: 'Orbitron', sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>storo08 server</h1>
      <p>server for 'leaderboard' and 'chase' projects</p>
      <hr />
    </header>
    <main>
      <section>
        <h2>leaderboard data</h2>
        <ul>
          <li>
            current month
            <ul>
              <li>
                <a href="./leaderboard/current" target="_blank"
                  >/leaderboard/current</a
                >
              </li>
            </ul>
          </li>
          <li>
            previous month
            <ul>
              <li>
                <a href="./leaderboard/previous" target="_blank"
                  >/leaderboard/previous</a
                >
              </li>
            </ul>
          </li>
        </ul>
      </section>
      <hr />
      <section>
        <h2>chase data</h2>
        <ul>
          <li>
            current month
            <ul>
              <li>
                <a href="./chase/current" target="_blank"
                  >/chase/current</a
                >
              </li>
            </ul>
          </li>
          <li>
            previous month
            <ul>
              <li>
                <a href="./chase/previous" target="_blank"
                  >/chase/previous</a
                >
              </li>
            </ul>
          </li>
        </ul>
      </section>
    </main>
    <script>
      const chaseReport = document.getElementById('chase-report');
      const chaseUpdate = document.getElementById('chase-update');

      const date = new Date().toISOString().slice(0, 10);

      chaseReport.innerHTML = `/chase/${date}`;
      chaseReport.setAttribute('href', `./chase/${date}`);

      chaseUpdate.innerHTML = `/chase-update/${date}`;
      chaseUpdate.setAttribute('href', `./chase-update/${date}`);
    </script>
  </body>
</html>
